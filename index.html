<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>គណនាថ្លៃផ្ញើរយានជំនិះ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Khmer OS Siemreap", "Battambang", Arial, sans-serif;
        }

        html,
        body {
            width: 100%;
            overflow-x: hidden;
            background-color: #ffffff;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .parking-box {
            width: 100%;
            max-width: 440px;
            background-color: #df8b88;
            padding: 36px 24px 32px;
            color: #181818;
            overflow: hidden;
        }

        .parking-box h2 {
            text-align: center;
            font-size: 23px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #181818;
        }

        .row-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
            width: 100%;
        }

        .row-item label {
            flex: 0 0 132px;
            max-width: 132px;
            font-size: 15px;
            line-height: 1.4;
            color: #181818;
            word-break: break-word;
        }

        .field-wrap {
            position: relative;
            flex: 1 1 0;
            min-width: 0;
            max-width: 100%;
        }

        .field-wrap select,
        .field-wrap input {
            display: block;
            width: 100%;
            min-width: 0;
            max-width: 100%;
            height: 46px;
            background-color: transparent;
            border: 1.5px solid #181818;
            border-radius: 10px;
            padding: 0 34px 0 12px;
            font-size: 15px;
            color: #181818;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .field-wrap select {
            background-image: linear-gradient(45deg, transparent 50%, #181818 50%),
                              linear-gradient(135deg, #181818 50%, transparent 50%);
            background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
            padding-right: 30px;
        }

        .field-wrap input[type="time"] {
            padding-right: 10px;
        }

        .field-wrap input[readonly] {
            cursor: default;
        }

        .field-wrap select:focus,
        .field-wrap input:focus {
            background-color: rgba(255, 255, 255, 0.16);
        }

        .suffix {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: rgba(24, 24, 24, 0.55);
            pointer-events: none;
        }

        .action-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .btn-calc {
            width: 100%;
            max-width: 225px;
            height: 46px;
            background-color: #b71c1c;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-calc:hover {
            background-color: #961616;
        }

        .btn-calc:active {
            background-color: #7a1010;
        }

        @media (max-width: 380px) {
            .parking-box {
                padding: 28px 16px 24px;
            }

            .row-item {
                gap: 8px;
            }

            .row-item label {
                flex: 0 0 112px;
                max-width: 112px;
                font-size: 14px;
            }

            .btn-calc {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="parking-box">
        <h2>គណនាថ្លៃផ្ញើរយានជំនិះ:</h2>

        <div class="row-item">
            <label for="vehicle">ជ្រើសរើស យានជំនិះ:</label>
            <div class="field-wrap">
                <select id="vehicle">
                    <option value="car">ឡាន</option>
                    <option value="moto">ម៉ូតូ</option>
                </select>
            </div>
        </div>

        <div class="row-item">
            <label for="timeIn">ម៉ោងចូល</label>
            <div class="field-wrap">
                <input type="time" id="timeIn">
            </div>
        </div>

        <div class="row-item">
            <label for="timeOut">ម៉ោងចេញ</label>
            <div class="field-wrap">
                <input type="time" id="timeOut">
            </div>
        </div>

        <div class="row-item">
            <label for="riel">ថ្លៃផ្ញើរ រៀល</label>
            <div class="field-wrap">
                <input type="text" id="riel" readonly>
                <span class="suffix">៛</span>
            </div>
        </div>

        <div class="row-item">
            <label for="dollar">ថ្លៃផ្ញើរ ដុល្លា</label>
            <div class="field-wrap">
                <input type="text" id="dollar" readonly>
                <span class="suffix">$</span>
            </div>
        </div>

        <div class="action-row">
            <button type="button" class="btn-calc" onclick="calculateParking()">គណនា</button>
        </div>
    </div>

    <script>
        function calculateParking() {
            const vehicle = document.getElementById("vehicle").value;
            const timeIn = document.getElementById("timeIn").value;
            const timeOut = document.getElementById("timeOut").value;

            if (!timeIn || !timeOut) {
                alert("សូមបញ្ចូលម៉ោងចូល និងម៉ោងចេញ!");
                return;
            }

            const [inH, inM] = timeIn.split(":").map(Number);
            const [outH, outM] = timeOut.split(":").map(Number);

            let startMinutes = inH * 60 + inM;
            let endMinutes = outH * 60 + outM;

            if (endMinutes < startMinutes) {
                endMinutes += 24 * 60;
            }

            const totalHours = (endMinutes - startMinutes) / 60;

            let rate = 0;
            if (vehicle === "car") {
                rate = totalHours <= 8 ? 500 : 1000;
            } else if (vehicle === "moto") {
                rate = totalHours <= 8 ? 200 : 300;
            }

            const totalRiel = totalHours * rate;
            const totalDollar = totalRiel / 4000;

            document.getElementById("riel").value = totalRiel.toFixed(0);
            document.getElementById("dollar").value = totalDollar.toFixed(2);
        }
    </script>

</body>

</html>
